name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Restore verified homepage
        run: |
          mkdir -p _site
          cat .pages-parts/index.html.gz.b64.* | base64 --decode | gzip --decompress > _site/index.html
          cp manifest.json *.js *.jpeg _site/
          test "$(wc -c < _site/index.html)" -eq 3129735
          echo "fbaaa24313435dc82fe5e0a0dad28ee28806221c45baaf427cce5941a3121e0f  _site/index.html" | sha256sum --check -
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
