        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            
            -ms-user-select: none;
    -webkit-tap-highlight-color: transparent;
        }

html {
    height: 100%;
    overflow: hidden;
    position: fixed;
    width: 100%;
}

       body {
    font-family: var(--font-family, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif);
    background: #000;
    touch-action: manipulation;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    -khtml-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
    user-select: none;
    transition: all 0.3s ease;
    color: var(--text-color, #000);
}

        .phone {
    width: 100vw;
    height: 100vh;
    background: var(--theme-bg, #f7f7f7);
    position: relative;
    overflow: hidden;
    touch-action: manipulation; 
    border-radius: var(--phone-radius, 0px);
    transition: all 0.3s ease;
}


@media not all and (display-mode: standalone) {
    .phone {
        height: 100dvh;
    }
}

        .screen {
            width: 100%;
            height: 100%;
            background: var(--theme-bg, #f7f7f7);
            position: relative;
            overflow: hidden;
            border-radius: var(--screen-radius, 0px);
            transition: all 0.3s ease;
        }

        

.status-bar {
    height: 30px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 38px;
    font-size: var(--font-size, 17px);
    font-weight: 600;
    color: var(--text-color, #000);
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 1000;
    border-radius: var(--status-radius, 0px);
    transition: background-color 0.3s ease;
    background-color: var(--nav-bg, #f8f8f8); 
}

        
        
        .phone.home-screen-active .status-bar,
        .phone.listen-together-active .status-bar {
            background-color: transparent;
        }
        
        .phone.home-screen-active .status-bar {
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
        }
        
        .wechat-dark-mode.home-screen-active .status-bar {
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
        }
        
        .phone.listen-together-active .status-bar {
            color: #fff;
            text-shadow: 0 1px 2px rgba(0,0,0,0.5);
        }
        
        
        .phone.voice-call-active .status-bar {
             color: #fff;
             background-color: transparent;
             text-shadow: 0 1px 2px rgba(0,0,0,0.5);
        }


        .status-left {
            display: flex;
            align-items: center;
        }

        .status-right {
            display: flex;
            align-items: center;
            gap: 1px;
        }

        
.signal-icon {
    width: 18px;
    height: 12px;
    display: flex;
    align-items: flex-end;
    gap: 2px; 
}

.signal-bar {
    width: 3.5px; 
    background: var(--text-color, #000);
    border-radius: 1px; 
}


.signal-bar:nth-child(1) { height: 4px; }
.signal-bar:nth-child(2) { height: 7px; }
.signal-bar:nth-child(3) { height: 9.5px; }
.signal-bar:nth-child(4) { height: 12px; }


.signal-bar.inactive {
    background: #dcdcdc; 
}
        
        .phone.listen-together-active .signal-bar,
        .phone.voice-call-active .signal-bar {
             background: #fff;
        }

        .signal-bar:nth-child(1) { height: 3px; }
        .signal-bar:nth-child(2) { height: 6px; }
        .signal-bar:nth-child(3) { height: 9px; }
        .signal-bar:nth-child(4) { height: 12px; }

        .network-icon {
            width: 28px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-color, #000);
            margin: 0 2px;
        }
        
        .phone.listen-together-active .network-icon,
        .phone.voice-call-active .network-icon {
            color: #fff;
        }

        .network-icon svg {
            width: 100%;
            height: 100%;
        }

        
.battery-icon {
    width: 24px;
    height: 13px;
    border-radius: 4px;
    border: 1.5px solid var(--text-color, #000);
    background-color: transparent;
    position: relative; 
}


.battery-tip {
    position: absolute; 
    width: 1.5px;
    height: 4px;
    top: 3.5px;
    right: -4px;
    border-radius: 0 1px 1px 0;
    background: var(--text-color, #000);
}


.battery-level {
    width: 71%; 
    height: calc(100% - 2px);
    background: var(--text-color, #000);
    border-radius: 2.5px;
    margin-left: 1.5px;
    margin-top: 1px;
}


.wechat-dark-mode .battery-icon,
.phone.listen-together-active .battery-icon,
.phone.voice-call-active .battery-icon {
    border-color: #fff;
}

.wechat-dark-mode .battery-tip,
.phone.listen-together-active .battery-tip,
.phone.voice-call-active .battery-tip {
    background: #fff;
}

.wechat-dark-mode .battery-level,
.phone.listen-together-active .battery-level,
.phone.voice-call-active .battery-level {
    background: #fff;
}

        

        

        .home-screen {
            height: 100%;
            background-size: cover;
            background-position: center;
            padding: 0;
            display: flex;
            flex-direction: column;
            margin-top: 0;
            position: relative;
            overflow-y: auto; 
            padding-bottom: 120px; 
        }
        
        

.profile-widget-container {
    width: 85%;
    max-width: 340px;
    margin: 70px auto 20px; 
    background-color: var(--bg-primary, white);
    border-radius: var(--app-radius, 14px);
    padding: 20px 0;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    transition: background-color 0.3s ease, box-shadow 0.3s ease;
}

        .profile-widget-container.transparent-bg {
            background-color: transparent;
            box-shadow: none;
        }
        .profile-widget-container .profile-widget {
            margin: 0 auto; /* Override its own margin */
            padding: 0;
            width: 100%;
        }


       

        .profile-avatar-widget {
            width: 80px;
            height: 80px;
            border-radius: var(--avatar-radius, 50%);
            background: linear-gradient(135deg, rgba(255,255,255,0.9) 0%, rgba(240,248,255,0.8) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: bold;
            color: #4a90e2;
            border: 3px solid rgba(0,0,0,0.1);
            backdrop-filter: blur(10px);
            background-size: cover;
            background-position: center;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 0 auto 15px;
        }

        .widget-info-section {
            background: transparent;
            padding: 0 20px;
            text-align: center;
        }

        .profile-name-widget {
            font-size: 22px;
            font-weight: 700;
            color: var(--text-color, #333333);
            font-family: var(--font-family, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif);
            margin-bottom: 8px;
            cursor: pointer;
            transition: color 0.2s ease;
        }

        .profile-signature-widget {
            font-size: 14px;
            color: var(--text-color, #555555);
            font-family: var(--font-family, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif);
            font-style: italic;
            cursor: pointer;
            transition: color 0.2s ease;
            margin-bottom: 12px;
            line-height: 1.4;
        }

        .profile-location {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            color: var(--text-color, #666666);
            font-family: var(--font-family, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif);
            cursor: pointer;
            transition: color 0.2s ease;
        }

        .location-icon {
            width: 14px;
            height: 14px;
            margin-right: 4px;
            fill: currentColor;
        }
        
        .home-widgets-container {
            display: flex;
            gap: 15px;
            padding: 0 20px;
            width: 100%;
            max-width: 340px;
            margin: 30px auto 0;
            align-items: flex-start;
        }
        
        .new-widget {
            flex: 1;
            aspect-ratio: 1 / 1;
            background-color: var(--bg-primary, white);
            border-radius: var(--app-radius, 14px);
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            transition: background-color 0.3s ease, box-shadow 0.3s ease;
        }

        /* --- NEW: Small widget transparent style --- */
        .new-widget.transparent-bg {
            background-color: transparent;
            box-shadow: none;
        }

        .widget-header-text {
            font-size: 12px;
            font-family: var(--font-family, monospace); 
            cursor: pointer;
            color: var(--text-color, #333);
            min-height: 20px; 
        }

        
.widget-bubble {
    background-color: rgba(255, 255, 255, 0.5); 

    
    backdrop-filter: blur(10px);           
    -webkit-backdrop-filter: blur(10px);   

    
    border-radius: 20px;
    padding: 8px 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-color, #333);
}

                .widget-bubble span {
            cursor: pointer;
            flex-grow: 1;
            text-align: center;
            min-height: 20px; 
        }
        .widget-bubble img {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            object-fit: cover;
            background-color: #ccc;
        }
        .wechat-dark-mode .widget-bubble {
            background-color: rgba(58, 58, 60, 0.5);
        }


        .app-grid {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            aspect-ratio: 1 / 1;
            justify-items: center;
            align-content: space-between;
        }

        .app {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
        }

        .app-icon-container {
            width: 100%;
            aspect-ratio: 1 / 1;
            border-radius: var(--app-radius, 14px);
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255,255,255,0.8);
            border: 1px solid rgba(0,0,0,0.05);
            transition: all 0.3s ease;
            background-size: cover;
            background-position: center;
        }
        
     
.app-icon-container i {
    font-size: 30px; 
    color: #000;     
}

.bottom-dock .app-icon-container i {
    font-size: 28px; 
}


.wechat-dark-mode .app-icon-container i {
    color: #fff;
}
        
        .app.wechat .app-icon { 
            fill: #000; 
        }

        .app-label {
    margin-top: 6px;
    color: var(--app-label-color, #333); 
    font-size: 10px;
    font-weight: 600;
}

        .bottom-dock {
    position: absolute;
    bottom: 20px; 
    left: 50%;
    transform: translateX(-50%);
    width: calc(100% - 30px);
    max-width: 380px;
    height: 95px; 
        background: rgba(255, 255, 255, 0.2); 
    backdrop-filter: blur(15px);           
    -webkit-backdrop-filter: blur(15px);   
    border-radius: 40px; 
    padding: 10px 20px;
    display: flex;
    gap: 15px;
    justify-content: center;
    align-items: center;
    z-index: 50;
}
        .wechat-dark-mode .bottom-dock {
            background: rgba(44, 44, 46, 0.7); 
        }
        .bottom-dock .app {
            width: 100%;
            flex: 1;
        }
        .bottom-dock .app-icon-container {
            width: 75%; 
            max-width: 55px;
            margin: 0 auto;
        }
        .bottom-dock .app-label {
            margin-top: 5px; 
            font-size: 10px; 
            font-weight: 600;
            color: var(--text-color);
        }

        .page {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--theme-bg, #f7f7f7);
            display: none;
            flex-direction: column;
            padding-top: 0;
            transition: transform 0.3s ease-in-out;
            transform: translateX(100%);
        }

        .page.active {
            display: flex;
            transform: translateX(0);
        }

        #homeScreen {
            transform: translateX(0);
        }

        
        #homeScreen.inactive {
            transform: translateX(-100%);
        }
        
        .page:not(.active) {
            transform: translateX(100%);
        }

        
.nav-bar {
    height: 44px;
    background: var(--nav-bg, #f8f8f8);
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 8px;
    flex-shrink: 0;
    position: absolute;
    top: 30px !important; 
    left: 0;
    right: 0;
    z-index: 10;
}

        
.nav-title {
    position: absolute;   
    left: 50%;            
    top: 50%;
    transform: translate(-50%,-50%); 
    
   
    text-align: center;
    font-size: var(--nav-font-size, 17px);
    font-weight: 600;
    color: var(--text-color, #000);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 60%; 
}

        
     .page > .wechat-content,
.page > .settings-content,
.page > .discover-content,
.page > .profile-content,
.page > .chat-settings-content,
.page > .diary-content-view,
#phoneApp > .phone-app-container {
    padding-top: 74px; 
    height: 100%;
    overflow-y: auto;
}

        
#wechatApp > .wechat-content {
    padding-top: 74px; 
}
        
        #wechatApp .discover-content, #wechatApp .profile-content {
            padding-top: 0;
        }

        .nav-btn {
            background: none;
            border: none;
            font-size: 20px;
            color: var(--text-color, #000);
            cursor: pointer;
            padding: 4px 12px;
            border-radius: var(--btn-radius, 6px);
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        
.wechat-bottom-nav {
    height: calc(49px + env(safe-area-inset-bottom, 0px));
    
    background: var(--nav-bg, #f7f7f7);
    border-top: 1px solid var(--border-color, #e0e0e0);
    display: flex;
    position: absolute;
    
    
    bottom: 0;
    
    width: 100%;
    z-index: 100;
    
    
    box-sizing: border-box;
 
    padding-bottom: env(safe-area-inset-bottom, 0px);
}

        .wechat-tab {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #999;
            font-size: var(--small-font-size, 10px);
        }

        .wechat-tab.active {
            color: #07c160;
        }

        .wechat-tab-icon {
            font-size: 18px;
            margin-bottom: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .icon-chat, .icon-discover, .icon-profile {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

       
.wechat-content {
    flex: 1;
    overflow-y: auto;
    
    padding-bottom: calc(49px + env(safe-area-inset-bottom, 0px));
    
    background: var(--theme-bg, #f7f7f7);
    transition: padding-bottom 0.3s ease;
}

        .friend-list {
            padding: 0;
            background: var(--theme-bg, #f7f7f7);
        }

        .friend-item {
            display: flex;
            align-items: center;
            padding: 12px 15px;
            border-bottom: 1px solid var(--border-light, #f0f0f0);
            cursor: pointer;
            background: var(--bg-primary, white);
            position: relative;
        }

        .friend-item:hover {
            background: var(--bg-hover, #f5f5f5);
        }

        .friend-item.pinned {
            background: var(--bg-hover, #f5f5f5);
        }

        .friend-item.pinned + .friend-item:not(.pinned) {
            margin-top: 8px;
        }

        .friend-avatar {
            width: 50px;
            height: 50px;
            border-radius: var(--friend-avatar-radius, 8px);
            background: var(--bg-primary, white);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-color, #333);
            font-weight: bold;
            margin-right: 12px;
            background-size: cover;
            background-position: center;
            border: none; 
            transition: all 0.3s ease;
            flex-shrink: 0; 
        }

        .friend-info {
            flex: 1;
            min-width: 0; 
        }

        .friend-name {
            font-size: var(--font-size, 16px);
            color: var(--text-color, #333);
            margin-bottom: 2px;
            font-family: var(--font-family, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .friend-message {
            font-size: var(--small-font-size, 13px);
            color: var(--text-color, #000); 
            font-family: var(--font-family, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            opacity: 0.8;
        }
        
        /* --- [BUG FIX] White Module Fix START --- */
        #chatScreen .wechat-content {
            padding-top: 0px;
            padding-bottom: 0; 
            background: transparent; 
            height: 100%;
            overflow: hidden; 
        }
        
        .chat-messages {
    height: 100%;
    
    padding: 74px 15px 65px 15px; 
    overflow-y: auto;
    background-size: cover;
    background-position: center;
    position: relative;
    transition: padding-bottom 0.3s ease;
    
    box-sizing: border-box; 
}
        /* --- [BUG FIX] White Module Fix END --- */

        .message {
            margin-bottom: 15px;
            display: flex;
            align-items: flex-start; 
            max-width: 100%;
            position: relative;
        }

        .message.sent {
            justify-content: flex-end;
        }
        
        .message-sender-name {
            font-size: 12px;
            color: var(--text-secondary, #888);
            margin-bottom: 4px;
            padding: 0 4px;
        }

        .message .message-body {
            display: flex;
            flex-direction: column;
            min-width: 0; 
            flex: 1; 
            position: relative; 
            max-width: calc(100% - 55px); 
        }

        .message.received .message-body {
            align-items: flex-start;
        }

        .message.sent .message-body {
            align-items: flex-end;
        }

        .message-content {
            max-width: 90%;
            padding: 10px 14px;
            font-size: var(--font-size, 15px);
            line-height: 1.4;
            word-wrap: break-word;
            word-break: break-word;
            font-family: var(--font-family, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif);
            cursor: pointer;
            position: relative;
            border-radius: var(--message-radius, 18px);
            color: var(--text-color, #000000);
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
            transition: all 0.3s ease;
             -webkit-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
    user-select: none;

    
    -webkit-touch-callout: none;
        }
        
       

        .message-content img {
            max-width: 180px;
            max-height: 180px;
            border-radius: 6px;
            display: block;
            cursor: pointer;
        }

        /* MODIFIED: Don't use bubble for images/emojis */
        .message-content.has-image,
        .message-content.has-emoji,
        .message-content.has-location {
            padding: 0;
            background-color: transparent;
            box-shadow: none;
            max-width: 250px; 
        }
        
        /* MODIFIED: Emoji size adjustment */
        .message-content.has-emoji img {
            max-width: 100px;
            max-height: 100px;
        }

        .message.received .message-content {
            background-color: var(--message-received-bg, #E6F2FF);
        }

        .message.sent .message-content {
            background-color: var(--message-sent-bg, #FFEEF6);
        }
        
        .message.recalled .message-content,
        .message.pat_pat .message-content {
            background: transparent;
            color: var(--text-secondary, #999);
            font-style: italic;
            padding: 6px 0;
            font-size: var(--small-font-size, 13px);
            text-align: center;
            box-shadow: none;
            border-radius: 0;
            margin: 0 auto;
            max-width: 200px;
        }
        
        .message.recalled .message-content::before,
        .message.pat_pat .message-content::before {
            display: none;
        }

        .quoted-message {
            background: rgba(0,0,0,0.05);
            padding: 8px 10px;

            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 24px;
        }

        .toggle-slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .toggle-slider {
            background-color: #007aff;
        }

        input:checked + .toggle-slider:before {
            transform: translateX(26px);
        }

#loadingOverlay {
    width: 100%;
    height: 100vh;
    background: #ffffff url('nagi-splash.jpeg') center / cover no-repeat !important;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    overflow: hidden;
}

#loadingOverlay * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

#loadingOverlay .splash-container {
    text-align: center;
    position: relative;
    width: min(82vw, 420px);
    margin-top: min(58vh, 520px);
}


#loadingOverlay .logo-section {
    display: none;
}

#loadingOverlay .logo {
    font-size: 68px;
    font-weight: 900;
    color: #000000;
    letter-spacing: 12px;
    display: flex;
    justify-content: center;
    gap: 6px;
    margin-bottom: 16px;
}

#loadingOverlay .logo span {
    display: inline-block;
    opacity: 0;
    transform: translateY(-30px);
    animation: jrsy_splash_letterFloat 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
}

#loadingOverlay .logo span:nth-child(1) { animation-delay: 0.1s; }
#loadingOverlay .logo span:nth-child(2) { animation-delay: 0.2s; }
#loadingOverlay .logo span:nth-child(3) { animation-delay: 0.3s; }
#loadingOverlay .logo span:nth-child(4) { animation-delay: 0.4s; }

@keyframes jrsy_splash_letterFloat {
    to {
        opacity: 1;
        transform: translateY(0);
    }
}


#loadingOverlay .ai-tag {
    font-size: 13px;
    font-weight: 600;
    color: #666;
    letter-spacing: 3px;
    opacity: 0;
    animation: jrsy_splash_fadeIn 0.6s ease-out 0.8s forwards;
}


#loadingOverlay .chat-bubbles {
    display: none;
    position: absolute;
    top: -100px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 12px;
    opacity: 0;
    animation: jrsy_splash_fadeIn 0.8s ease-out 0.5s forwards;
}

#loadingOverlay .bubble {
    width: 8px;
    height: 8px;
    background-color: #000;
    border-radius: 50%;
    animation: jrsy_splash_bubblePulse 1.5s ease-in-out infinite;
}

#loadingOverlay .bubble:nth-child(2) { animation-delay: 0.2s; }
#loadingOverlay .bubble:nth-child(3) { animation-delay: 0.4s; }

@keyframes jrsy_splash_bubblePulse {
    0%, 100% { 
        transform: scale(1);
        opacity: 0.3;
    }
    50% { 
        transform: scale(1.4);
        opacity: 1;
    }
}

/* è¿›åº¦æ¡åŒºåŸŸ */
#loadingOverlay .progress-wrapper {
    position: relative;
    width: 100%;
    padding: 14px 18px 12px;
    border-radius: 18px;
    background: rgba(255,255,255,.82);
    -webkit-backdrop-filter: blur(12px);
    backdrop-filter: blur(12px);
}

#loadingOverlay .loading-text {
    font-size: 12px;
    font-weight: 500;
    color: #111;
    letter-spacing: 2px;
    margin-bottom: 24px;
    opacity: 0;
    animation: jrsy_splash_fadeIn 0.6s ease-out 1s forwards;
    height: 15px;
}

#loadingOverlay .typing-text {
    display: inline-block;
    border-right: 2px solid #000;
    animation: jrsy_splash_blink 0.8s step-end infinite;
}

@keyframes jrsy_splash_blink {
    50% { border-color: transparent; }
}

#loadingOverlay .progress-container {
    width: 100%;
    height: 5px;
    background-color: rgba(0,0,0,.16);
    position: relative;
    overflow: hidden;
    border-radius: 2px;
}


#loadingOverlay .progress-bar {
    height: 100%;
    width: 0%;
    background: #000;
    background-size: 200% 100%;
    animation: 
        none;
    position: relative;
    
    transition: width 0.1s linear; 
}


@keyframes jrsy_splash_shimmer {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
}


#loadingOverlay .percentage {
    position: absolute;
    top: -35px;
    right: 0;
    font-size: 13px;
    font-weight: 600;
    color: #000;
    font-variant-numeric: tabular-nums;
    opacity: 0;
    animation: jrsy_splash_fadeIn 0.6s ease-out 1.2s forwards;
}


#loadingOverlay .status-hints {
    margin-top: 20px;
    height: 20px;
    opacity: 0;
    animation: jrsy_splash_fadeIn 0.6s ease-out 1.5s forwards;
}

#loadingOverlay .hint {
    font-size: 11px;
    color: #bbb;
    letter-spacing: 1px;
    opacity: 0;
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
}

#loadingOverlay .hint.active {
    animation: jrsy_splash_hintFade 1.5s ease-in-out;
}

@keyframes jrsy_splash_hintFade {
    0%, 100% { opacity: 0; }
    20%, 80% { opacity: 1; }
}

@keyframes jrsy_splash_fadeIn {
    to { opacity: 1; }
}


#loadingOverlay .fade-out {
    animation: jrsy_splash_fadeOut 0.8s ease-out forwards;
}

@keyframes jrsy_splash_fadeOut {
    to {
        opacity: 0;
        transform: translateY(-20px);
        visibility: hidden;
    }
}


@media (max-width: 768px) {
    #loadingOverlay .logo {
        font-size: 52px;
        letter-spacing: 8px;
    }
    #loadingOverlay .progress-wrapper {
        width: 100%;
    }
    #loadingOverlay .chat-bubbles {
        top: -80px;
    }
}

/* 2. è¿·ä½ ä¿¡å° (åˆ—è¡¨é¡¹) */
.mini-envelope-wrapper {
    width: 100%; max-width: 280px; height: 160px; position: relative; cursor: pointer;
}
.envelope-structure {
    position: absolute; width: 300px; height: 200px; transform: scale(0.85); transform-origin: top left;
}
.env-back {
    position: absolute; bottom: 0; width: 100%; height: 100%;
    background: #ffc4e1; border-radius: 0 0 10px 10px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.08); z-index: 1;
}
.env-body {
    position: absolute; bottom: 0; left: 0; width: 100%; height: 100%; 
    background: #ffc4e1; z-index: 3; border-radius: 0 0 10px 10px;
    clip-path: polygon(0% 0%, 50% 50%, 100% 0%, 100% 100%, 0% 100%);
}
.env-flap {
    position: absolute; top: 0; left: 0; width: 100%; height: 120px; 
    background: #ffd6eb; clip-path: polygon(0% 0%, 100% 0%, 50% 100%);
    z-index: 4; transform-origin: top; transition: transform 0.6s ease;
    filter: drop-shadow(0 3px 5px rgba(0,0,0,0.1));
}
.env-seal {
    position: absolute; top: 95px; left: 50%;
    transform: translateX(-50%) rotate(45deg);
    width: 30px; height: 30px; background: #e91e63; z-index: 5;
    box-shadow: 2px 2px 5px rgba(0,0,0,0.1);
}
.env-seal:before, .env-seal:after {
    content: ""; position: absolute; width: 30px; height: 30px;
    background: #e91e63; border-radius: 50%;
}
.env-seal:before { left: -15px; }
.env-seal:after { top: -15px; }
